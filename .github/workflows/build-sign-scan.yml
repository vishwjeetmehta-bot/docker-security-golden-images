name: "Container Build, Sign & SBOM CI"

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Python Golden Image
        run: |
          docker build -t golden-python:latest images/python/ -f images/python/Dockerfile || true
